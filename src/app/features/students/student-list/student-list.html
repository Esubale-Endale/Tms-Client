<div class="flex items-center justify-between py-3 px-5">
  <h1 class="text-xl font-bold">Student</h1>
  <button mat-raised-button (click)="openRegisterDialog()">Register Student</button>
</div>
<table mat-table [dataSource]="dataSource" class="mat-shadow-2">
  <ng-container matColumnDef="registrationNumber">
    <th mat-header-cell *matHeaderCellDef>Registration Number</th>
    <td mat-cell *matCellDef="let element">{{ element.registrationNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="gpa">
    <th mat-header-cell *matHeaderCellDef>GPA</th>
    <td mat-cell *matCellDef="let element">{{ element.gpa }}</td>
  </ng-container>

  <ng-container matColumnDef="isActive">
    <th mat-header-cell *matHeaderCellDef>Active</th>
    <td mat-cell *matCellDef="let element">{{ element.isActive }}</td>
  </ng-container>

  <ng-container matColumnDef="enrollmentCount">
    <th mat-header-cell *matHeaderCellDef>Enrollment Count</th>
    <td mat-cell *matCellDef="let element">{{ element.enrollmentCount }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
