<div class="admin-course-list">
  <h2>Admin Course List</h2>
  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
    <ng-container matColumnDef="courseCode">
      <th mat-header-cell *matHeaderCellDef>Course Code</th>
      <td mat-cell *matCellDef="let element">{{ element.courseCode }}</td>
    </ng-container>

    <ng-container matColumnDef="courseName">
      <th mat-header-cell *matHeaderCellDef>Course Name</th>
      <td mat-cell *matCellDef="let element">{{ element.courseName }}</td>
    </ng-container>

    <ng-container matColumnDef="credits">
      <th mat-header-cell *matHeaderCellDef>Credits</th>
      <td mat-cell *matCellDef="let element">{{ element.credits }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['courseCode', 'courseName', 'credits']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['courseCode', 'courseName', 'credits']"></tr>
  </table>
</div>
