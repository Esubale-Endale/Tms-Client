<div class="admin-course-list">
  <h2>Admin Course List</h2>
  <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
    <ng-container matColumnDef="courseCode">
      <th mat-header-cell *matHeaderCellDef>Course Code</th>
      <td mat-cell *matCellDef="let course">
        <a href="/admin/courses/:{{ course.id }}">{{ course.code }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="courseName">
      <th mat-header-cell *matHeaderCellDef>Course Name</th>
      <td mat-cell *matCellDef="let course">{{ course.title }}</td>
    </ng-container>

    <ng-container matColumnDef="maxCapacity">
      <th mat-header-cell *matHeaderCellDef>Max Capacity</th>
      <td mat-cell *matCellDef="let course">{{ course.maxCapacity }}</td>
    </ng-container>

    <ng-container matColumnDef="enrollmentCount">
      <th mat-header-cell *matHeaderCellDef>Enrollment Count</th>
      <td mat-cell *matCellDef="let course">{{ course.enrollmentCount }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['courseCode', 'courseName', 'maxCapacity', 'enrollmentCount']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['courseCode', 'courseName', 'maxCapacity', 'enrollmentCount']"></tr>
  </table>
</div>
