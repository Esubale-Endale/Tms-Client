<div class="flex justify-center items-center w-screen h-screen">
  <div class="m-auto border p-4" style="max-width: 400px">
    <h1>Login</h1>

    @if (error()) {
      <p class="error">
        {{ error() }}
      </p>
    }

    <form (ngSubmit)="login()">
      <div>
        <label>Username</label>

        <input
          type="text"
          name="username"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          required
        />
      </div>

      <div>
        <label>Password</label>

        <input
          type="password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          required
        />
      </div>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
