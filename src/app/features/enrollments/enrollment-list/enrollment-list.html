<table mat-table [dataSource]="dataSource" matSort class="mat-ele vation-z8">
  <ng-container matColumnDef="studentId">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Student ID</th>
    <td mat-cell *matCellDef="let row">{{ row.studentId }}</td>
  </ng-container>
  <ng-container matColumnDef="courseId">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Course ID</th>

    <td mat-cell *matCellDef="let row">{{ row.courseId }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let row">
      {{
        row.status === EnrollmentStatus.Pending
          ? 'Pending'
          : row.status === EnrollmentStatus.Approved
            ? 'Approved'
            : 'Rejected'
      }}
    </td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      @if (row.status === EnrollmentStatus.Pending) {
        <button (click)="store.approveEnrollment(row.id)">Approve</button>
      }
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons> </mat-paginator>
