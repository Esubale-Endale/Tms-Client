<div class="card flex flex-col gap-2 m-3 px-6 py-3 bg-gray-200 w-full h-full">
  <div class="flex mb-6">
    <h3>
      <a class="cursor-pointer text-xl font-bold text-blue-500" [routerLink]="['/courses', course().id]">
        <span class="block"> {{ course().title }} </span>
        <span class="block"> ({{ course().code }}) </span>
      </a>
    </h3>
  </div>
  <p>Enrolled {{ course().enrollmentCount }}/{{ course().maxCapacity }} seats</p>
  <span class="badge" [class.closed]="course().enrollmentCount >= course().maxCapacity">
    {{ course().enrollmentCount >= course().maxCapacity ? 'Full' : 'Accepting enrollments' }}
  </span>
  @if (auth.isAdmin()) {
    <button
      class="text-White mt-3 bg-red-400 box-border border border-transparent hover:bg-red-500 focus:ring-4 focus:ring-red-400 shadow-xs font-medium leading-5 rounded-xl text-sm px-4 py-2.5 focus:outline-none"
      (click)="deleteCourse.emit(course().id)"
    >
      Delete Course
    </button>
  }
  @if (auth.isStudent()) {
    <button
      class="text-white mt-3 bg-blue-500 box-border border border-transparent hover:bg-blue-600 focus:ring-4 focus:ring-blue-400 shadow-xs font-medium leading-5 rounded-xl text-sm px-4 py-2.5 focus:outline-none"
      (click)="enrollClicked.emit(course())"
      [disabled]="course().enrollmentCount >= course().maxCapacity"
    >
      Enroll
    </button>
  }
</div>
