<mat-toolbar>
  <span>Tms Client</span>

  <span class="spacer"></span>

  @if (authService.currentUser(); as user) {
    @for (item of roleToLinkMap[user.role] || []; track $index) {
      <a mat-button routerLink="{{ item.route }}">{{ item.label }}</a>
    }

    <span class="spacer"></span>
    <span class="identity" (click)="profile()">{{ user.displayName }}</span>
    <button mat-button type="button" (click)="logout()">Sign out</button>
  } @else {
    <a mat-button routerLink="/login">Sign in</a>
  }
</mat-toolbar>
